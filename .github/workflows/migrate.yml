name: Migrate Legacy Releases

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: owlbot-migration
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  migrate-pypi:
    name: Build and publish historical releases
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/owlbot/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build historical release tags
        run: |
          tags=(v1.0.0 v1.1.0 v1.1.1 v1.2.0)
          build_root="$RUNNER_TEMP/owlbot-builds"
          mkdir -p "$build_root" dist

          for tag in "${tags[@]}"; do
            source_dir="$build_root/$tag"
            git worktree add --detach "$source_dir" "refs/tags/$tag"
            uv build --no-config --no-sources \
              --default-index https://pypi.org/simple/ \
              --out-dir "$GITHUB_WORKSPACE/dist" "$source_dir"
            test -f "dist/owlbot-${tag#v}-py3-none-any.whl"
            test -f "dist/owlbot-${tag#v}.tar.gz"
          done

      - name: Record built distribution hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          artifacts = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          if len(artifacts) != 8:
              raise RuntimeError("Expected a wheel and source archive for each of the 4 release tags")
          manifest = {
              artifact.name: hashlib.sha256(artifact.read_bytes()).hexdigest()
              for artifact in artifacts
          }
          Path("migration-manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          PY

      - name: Validate distribution metadata
        run: uvx --from twine twine check dist/*

      - name: Publish built distributions to PyPI
        run: >-
          uv publish --no-config --trusted-publishing always
          --publish-url https://upload.pypi.org/legacy/
          --check-url https://pypi.org/simple/ dist/*

      - name: Verify migrated distributions on PyPI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen

          expected = json.loads(Path("migration-manifest.json").read_text(encoding="utf-8"))
          with urlopen("https://pypi.org/pypi/owlbot/json", timeout=60) as response:
              metadata = json.load(response)
          published = {
              artifact["filename"]: artifact["digests"]["sha256"]
              for artifacts in metadata["releases"].values()
              for artifact in artifacts
          }
          for filename, digest in expected.items():
              if published.get(filename) != digest:
                  raise RuntimeError(f"Missing or different distribution on PyPI: {filename}")
          print(f"Verified all {len(expected)} migrated distributions on PyPI")
          PY

  migrate-images:
    name: Copy and verify historical images
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
    env:
      SOURCE_IMAGE: git.logal.dev/logaldeveloper/owlbot
      DESTINATION_IMAGE: ghcr.io/logaldeveloper/owlbot
    steps:
      - name: Install Skopeo
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y skopeo

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login \
            --username "$GHCR_USERNAME" --password-stdin ghcr.io

      - name: Copy and verify image digests
        run: |
          tags=(v1.1.1 v1.2.0 latest)

          destination_manifest="$RUNNER_TEMP/owlbot-destination-manifest.json"
          destination_error="$RUNNER_TEMP/owlbot-destination-error.log"
          for tag in "${tags[@]}"; do
            source_digest=$(skopeo inspect --raw "docker://$SOURCE_IMAGE:$tag" | skopeo manifest-digest /dev/stdin)
            if skopeo inspect --raw "docker://$DESTINATION_IMAGE:$tag" > "$destination_manifest" 2> "$destination_error"; then
              destination_digest=$(skopeo manifest-digest "$destination_manifest")
              if [[ "$destination_digest" != "$source_digest" ]]; then
                echo "Refusing to overwrite different destination image: $DESTINATION_IMAGE:$tag" >&2
                exit 1
              fi
            elif ! grep -Eq ': (manifest unknown|name unknown)(:|"?$)' "$destination_error"; then
              cat "$destination_error" >&2
              exit 1
            fi

            skopeo copy --all --preserve-digests \
              "docker://$SOURCE_IMAGE@$source_digest" "docker://$DESTINATION_IMAGE:$tag"
            destination_digest=$(skopeo inspect --raw "docker://$DESTINATION_IMAGE:$tag" | skopeo manifest-digest /dev/stdin)
            if [[ "$destination_digest" != "$source_digest" ]]; then
              echo "Digest mismatch for $DESTINATION_IMAGE:$tag" >&2
              exit 1
            fi
            printf 'Verified `%s:%s` at `%s`\n' "$DESTINATION_IMAGE" "$tag" "$source_digest" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Remove registry credentials
        if: always()
        run: |
          if command -v skopeo >/dev/null; then
            skopeo logout --all
          fi