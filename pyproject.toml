[project]
name = "owlbot"
dynamic = ["version"]
description = "An Owncast chat bot with a modular event-driven architecture"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Logan Fick" },
]
dependencies = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "cronsim>=2.7",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
owlbot = "owlbot.__main__:main"

[project.urls]
Repository = "https://git.logal.dev/LogalDeveloper/Owlbot"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "freezegun>=1.5.5",
    "mypy>=1.18.1",
    "types-PyYAML>=6.0.12.20250915",
    "ruff>=0.15.1",
    "pip-audit>=2.10.0",
]

[tool.uv]
extra-index-url = ["https://git.logal.dev/api/packages/LogalDeveloper/pypi/simple/"]
publish-url = "https://git.logal.dev/api/packages/LogalDeveloper/pypi"

[build-system]
requires = ["hatchling>=1.28.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["owlbot"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "owlbot/_defaults/config.example.yaml"

[tool.hatch.build.hooks.vcs]
version-file = "owlbot/_version.py"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
extend-exclude = ["owlbot/_version.py"]  # auto-generated by hatch-vcs

[tool.ruff.lint]
select = [
    # Core
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "N",     # pep8-naming
    "D",     # pydocstyle
    "I",     # isort
    "ICN",   # flake8-import-conventions

    # Correctness & bugs
    "B",     # flake8-bugbear
    "ASYNC", # flake8-async
    "DTZ",   # flake8-datetimez
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "A",     # flake8-builtins
    "PIE",   # flake8-pie

    # Modernization & simplification
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "FLY",   # flynt (f-string conversion)
    "PTH",   # flake8-use-pathlib

    # Performance
    "PERF",  # Perflint

    # Security
    "S",     # flake8-bandit

    # Code hygiene
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "ERA",   # eradicate
    "PGH",   # pygrep-hooks
    "TCH",   # flake8-type-checking

    # Testing
    "PT",    # flake8-pytest-style

    # Ruff-specific
    "RUF",   # Ruff-specific rules
]
ignore = [
    "D203",  # incompatible with D211 (no blank line before class docstring)
    "D213",  # incompatible with D212 (summary on first line)
]

[tool.ruff.lint.per-file-ignores]
"owlbot/__init__.py" = ["E402"]     # constants defined before imports intentionally
"owlbot/__main__.py" = ["T201"]     # CLI entry point uses print() for user output
"tests/**" = ["S101", "S311"]       # assert is standard for pytest; random is fine in tests

[tool.coverage.run]
source = ["owlbot"]
omit = [
    "owlbot/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
