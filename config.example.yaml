owncast:
  # REQUIRED: URL where viewers access your stream.
  # Example: "https://stream.logal.dev"
  url: ""

  # REQUIRED: API access token for the Owncast integrations API.
  # Generate one in Owncast under Admin -> Integrations -> Access Tokens.
  access_token: ""

  # OPTIONAL: admin API access for privileged operations like user
  # management, server configuration, and moderation.
  admin:
    enabled: false
    username: "admin"
    password: "abc123"

owlbot:
  # Address and port to bind the web server.
  host: "127.0.0.1"
  port: 8081

  # Secret token for the webhook URL path (/webhook/<secret>).
  # Auto-generated on first run. Leave empty unless you have a specific
  # reason to set it manually.
  webhook_secret: ""

  # Public base URL for Owlbot's web server. Set this if Owlbot is
  # hosted on a different domain than your Owncast instance.
  #public_base_url: "https://owlbot.example.com"

  # Prefix character for chat commands.
  command_prefix: "!"

  # Maximum seconds to wait for an event or command handler to complete.
  # If a handler exceeds this, it is cancelled.
  handler_timeout: 30.0

  # Directory for per-module SQLite databases. Each module gets its own
  # <module_name>.db file in this directory. Relative paths are resolved
  # from the working directory.
  storage_dir: "data"

  # Directory containing user modules. Built-in modules are loaded from
  # the package regardless of this setting.
  modules_dir: "modules"

  # Directory for the owlbot.log file. When set, logs are written to
  # owlbot.log in this directory in addition to stdout. When unset,
  # logs go to stdout only.
  #log_dir: "logs"


# Per-module configuration. Each key is a module name (the filename without
# .py for single-file modules, or the directory name for package modules).
# Modules are enabled by default; set enabled: false to disable.
modules:
  clips:
    enabled: true

    # How far back (in seconds) viewers can clip from the live stream.
    #cache_duration: 300
    # Minimum clip length in seconds.
    #min_clip_length: 5
    # Maximum clip length in seconds.
    #max_clip_length: 120
    # Directory where saved clip files are stored.
    #clips_dir: "data/clips"
    # Seconds before a clip editing session expires if unused.
    #session_expiry: 900
    # Seconds to keep footage available after stream stops.
    #grace_period: 120

  custom_commands:
    enabled: true

    # Default cooldown in seconds for new custom commands.
    #default_cooldown: 5
    # Maximum nesting depth for placeholders in command responses.
    #max_nesting_depth: 4

  emoji_wall:
    enabled: true

    # Minimum emoji size in pixels.
    #min_size: 20
    # Maximum emoji size in pixels.
    #max_size: 60
    # Minimum animation duration in seconds.
    #min_duration: 3
    # Maximum animation duration in seconds.
    #max_duration: 10
    # Maximum number of emojis on screen at once.
    #max_count: 50
    # Direction emojis travel. Named presets: up, up-right, right,
    # down-right, down, down-left, left, up-left, random.
    # Also accepts a degree value (0-359, where 0 is up, clockwise).
    #direction: "up"
    # Maximum rotation angle in degrees. Each emoji gets a random
    # rotation between -max_rotation and +max_rotation. Set to 0 to
    # disable rotation.
    #max_rotation: 25

  quotes:
    enabled: true

  timers:
    enabled: true
